name: release-windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach Windows artifacts to (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Resolve target ref/tag
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package Windows .exe
        shell: cmd
        run: |
          fyne package --os windows --name SleepSwitch --app-id com.luciferdennica.sleepswitch --icon %CD%\assets\icon.png --src .\cmd\sleepswitch --release
          if not exist build mkdir build
          move /Y cmd\sleepswitch\SleepSwitch.exe build\SleepSwitch.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SleepSwitch.iss'

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          files: |
            build/SleepSwitch-*-Setup.exe
            build/SleepSwitch.exe
          fail_on_unmatched_files: true
